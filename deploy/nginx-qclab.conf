# QC Lab behind nginx, on one address so session sign-in stays simple.
# Replace qclab.example.com and the paths. The web server listens on 127.0.0.1:8007.

# Slows guessing at the sign-in page. The application locks an account as well.
limit_req_zone $binary_remote_addr zone=qclab_login:10m rate=20r/m;

server {
    listen 80;
    server_name qclab.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name qclab.example.com;

    ssl_certificate     /etc/ssl/certs/qclab.crt;
    ssl_certificate_key /etc/ssl/private/qclab.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Keep in step with MAX_REQUEST_BYTES in backend/qclab/middleware.py.
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /api/auth/login/ {
        limit_req zone=qclab_login burst=10 nodelay;
        include /etc/nginx/snippets/qclab-proxy.conf;
    }

    # Django: the API, the public verification page and the admin site.
    location /api/        { include /etc/nginx/snippets/qclab-proxy.conf; }
    location /verify/     { include /etc/nginx/snippets/qclab-proxy.conf; }
    location /site-admin/ { include /etc/nginx/snippets/qclab-proxy.conf; }

    # manage.py collectstatic puts Django admin's files here.
    location /static/ {
        alias /srv/qclab/backend/staticfiles/;
    }

    # The screens: frontend/dist. Refreshing any page serves index.html.
    location / {
        root /srv/qclab/frontend/dist;
        try_files $uri /index.html;
    }
}

